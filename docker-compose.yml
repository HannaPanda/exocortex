# Local / self-hosted infrastructure for Exocortex.
#
# Host ports are deliberately non-default so this stack can coexist with other
# services on the same machine (see docs/local-development.md).
name: exocortex

services:
  postgres:
    # pgvector image so the `vector` extension is available for future semantic
    # search (ADR-006). No embeddings are generated yet.
    image: pgvector/pgvector:pg17
    container_name: exocortex-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-exocortex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-exocortex}
      POSTGRES_DB: ${POSTGRES_DB:-exocortex}
    ports:
      - '127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-exocortex} -d ${POSTGRES_DB:-exocortex}']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redis:
    image: redis:8-alpine
    container_name: exocortex-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    ports:
      - '127.0.0.1:${REDIS_HOST_PORT:-6380}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: exocortex-minio
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-exocortex}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-exocortex-dev-secret}
    ports:
      - '127.0.0.1:${MINIO_HOST_PORT:-9110}:9000'
      - '127.0.0.1:${MINIO_CONSOLE_HOST_PORT:-9111}:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 30

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: exocortex-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY_ID:-exocortex} ${S3_SECRET_ACCESS_KEY:-exocortex-dev-secret} &&
      mc mb --ignore-existing local/${S3_BUCKET:-exocortex} &&
      mc anonymous set none local/${S3_BUCKET:-exocortex} &&
      echo 'MinIO bucket ready'
      "
    restart: 'no'

  mailpit:
    image: axllent/mailpit:v1.27
    container_name: exocortex-mailpit
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - '127.0.0.1:${MAILPIT_SMTP_HOST_PORT:-1026}:1025'
      - '127.0.0.1:${MAILPIT_UI_HOST_PORT:-8026}:8025'
    volumes:
      - mailpit-data:/data
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
    name: exocortex-postgres-data
  redis-data:
    name: exocortex-redis-data
  minio-data:
    name: exocortex-minio-data
  mailpit-data:
    name: exocortex-mailpit-data
