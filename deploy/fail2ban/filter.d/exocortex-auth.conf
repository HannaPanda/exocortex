# Failed Exocortex sign-in and password-reset attempts, read from the nginx
# access log.
#
# Deliberately not the application log: pino writes structured JSON to the
# journal and does not record the client address, so there is nothing there to
# ban. nginx already knows the real address and writes it as the first field.
#
# 401 is a wrong password. 429 is Better Auth's own per-IP limit having already
# tripped -- someone still hammering after that is not a person mistyping.

[Definition]

failregex = ^<HOST> - \S+ \[\] "POST /api/auth/(sign-in/email|request-password-reset|reset-password)(\?\S*)? HTTP/[0-9.]+" (401|429) 

ignoreregex =

datepattern = %%d/%%b/%%Y:%%H:%%M:%%S %%z
