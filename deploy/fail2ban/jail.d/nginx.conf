# nginx jails. Added 2026-08-08 during the security audit.
#
# Without these, every login form behind nginx (Windmill, Grafana, Infisical)
# and every HTTP basic auth realm can be guessed at full speed from any IP.
# fail2ban only shipped the sshd jail on this host.

[nginx-http-auth]
enabled  = true
port     = http,https
backend  = auto
logpath  = /var/log/nginx/error.log
maxretry = 5
findtime = 600
bantime  = 3600

[nginx-botsearch]
enabled  = true
port     = http,https
backend  = auto
logpath  = /var/log/nginx/error.log
maxretry = 10
findtime = 600
bantime  = 3600

# Exocortex application logins. Added 2026-08-09.
#
# The nginx-http-auth jail above only sees HTTP basic auth failures. Once the
# basic auth in front of exocortex.app comes off, nothing watches the actual
# login form: Better Auth's per-IP limit slows an attacker to 10 guesses a
# minute but never stops them. This jail does the stopping.
#
# maxretry is deliberately loose. A person who forgot their password tries a
# handful of variations; ten failures inside ten minutes is a machine. The
# private network, the Docker bridges and fpb2 are exempt so a banned address
# can never be one of our own automations.
[exocortex-auth]
enabled  = true
filter   = exocortex-auth
port     = http,https
backend  = auto
logpath  = /var/log/nginx/access.log
maxretry = 10
findtime = 600
bantime  = 3600
ignoreip = 127.0.0.1/8 ::1 10.0.0.0/16 172.16.0.0/12 49.13.50.163
