# nginx reverse proxy for Exocortex.
#
# Installed as /etc/nginx/sites-available/exocortex and symlinked into
# sites-enabled. TLS lines are managed by Certbot.
#
# Everything is behind HTTP basic auth while the deployment is private
# (see deploy/README.md). The ACME challenge path is exempt so certificate
# renewal keeps working.

upstream exocortex_web {
    server 127.0.0.1:3210;
    keepalive 32;
}

upstream exocortex_api {
    server 127.0.0.1:3211;
    keepalive 32;
}

upstream exocortex_collaboration {
    server 127.0.0.1:3212;
    keepalive 32;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    server_name exocortex.app www.exocortex.app;

    client_max_body_size 32m;

    # Security headers. The application also sets its own headers; these are the
    # edge defaults.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    auth_basic "Exocortex (privater Zugang)";
    auth_basic_user_file /etc/nginx/exocortex.htpasswd;

    # Let's Encrypt HTTP-01 challenge must stay publicly reachable.
    location ^~ /.well-known/acme-challenge/ {
        auth_basic off;
        root /var/www/html;
    }

    # Hocuspocus collaboration WebSocket.
    location /collab {
        proxy_pass http://exocortex_collaboration;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # Application realtime channel (Socket.IO) served by the NestJS API.
    location /realtime {
        proxy_pass http://exocortex_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }

    # REST API and Better Auth endpoints.
    location /api/ {
        proxy_pass http://exocortex_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Nothing behind /api/ may take longer than this. Anything that can
        # take longer belongs in the queue (docs/background-jobs.md): an AI
        # run's own time budget (ai.maxRunMs) lives in the worker, not in an
        # HTTP request -- POST /api/ai/runs answers as soon as the job is
        # enqueued (docs/ai-architecture.md).
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }

    location /docs {
        proxy_pass http://exocortex_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health/ {
        auth_basic off;
        proxy_pass http://exocortex_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    # Next.js application.
    location / {
        proxy_pass http://exocortex_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/exocortex.app/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/exocortex.app/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}


server {
    if ($host = www.exocortex.app) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = exocortex.app) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    server_name exocortex.app www.exocortex.app;

    listen 80;
    return 404; # managed by Certbot




}