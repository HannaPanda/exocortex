# nginx reverse proxy for Exocortex.
#
# Installed as /etc/nginx/sites-available/exocortex and symlinked into
# sites-enabled. TLS lines are managed by Certbot.
#
# The deployment is open to the internet: the application's own authentication
# is the only gate, which is what it is designed to be. What used to be an
# nginx basic auth realm in front of everything was removed on 2026-08-09,
# after the things it had been quietly covering were fixed -- Swagger sat
# outside every guard, and the per-IP login limits were reset by a forged
# X-Forwarded-For. See docs/security.md.

upstream exocortex_web {
    server 127.0.0.1:3210;
    keepalive 32;
}

upstream exocortex_api {
    server 127.0.0.1:3211;
    keepalive 32;
}

upstream exocortex_collaboration {
    server 127.0.0.1:3212;
    keepalive 32;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    server_name exocortex.app www.exocortex.app;

    client_max_body_size 32m;

    # Security headers. The application also sets its own headers; these are the
    # edge defaults.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Let's Encrypt HTTP-01 challenge.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # OAuth discovery for remote MCP clients (RFC 8414 and RFC 9728).
    #
    # Both documents must live at the *origin* root: that is where a client
    # looks, and it is not negotiable.
    #
    # The two are answered differently, because the library answers them
    # differently. The authorization-server document is a route under Better
    # Auth's base path, so nginx rewrites onto it. The protected-resource
    # document is served by a request hook in `@better-auth/mcp` that matches
    # the real path, so that one is proxied untouched and the API passes it
    # through (`WellKnownController`); rewriting it would hide the very path
    # the hook is looking for.
    #
    # The `(?:/.*)?` tail matters. A client that finds an MCP endpoint at
    # /api/mcp asks for /.well-known/oauth-authorization-server/api/mcp first
    # and only then for the bare path; answering both saves a round trip and,
    # with some clients, saves the connection. The rewrite is what makes every
    # one of those spellings land on the one document.
    #
    # `rewrite … break` rather than a URI on `proxy_pass`: nginx forbids the
    # latter in a regex location.
    location ~ ^/\.well-known/oauth-authorization-server(?:/.*)?$ {
        rewrite ^ /api/auth/.well-known/oauth-authorization-server break;
        proxy_pass http://exocortex_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/\.well-known/oauth-protected-resource(?:/.*)?$ {
        proxy_pass http://exocortex_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hocuspocus collaboration WebSocket.
    location /collab {
        proxy_pass http://exocortex_collaboration;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;  # not $proxy_add_x_forwarded_for:
        # that appends to whatever the caller sent, so the header would start
        # with an address the caller chose. Nothing sits in front of this nginx,
        # so $remote_addr is the truth. (2026-08-09, security audit)
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # Application realtime channel (Socket.IO) served by the NestJS API.
    location /realtime {
        proxy_pass http://exocortex_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;  # not $proxy_add_x_forwarded_for:
        # that appends to whatever the caller sent, so the header would start
        # with an address the caller chose. Nothing sits in front of this nginx,
        # so $remote_addr is the truth. (2026-08-09, security audit)
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }

    # REST API and Better Auth endpoints.
    location /api/ {
        proxy_pass http://exocortex_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;  # not $proxy_add_x_forwarded_for:
        # that appends to whatever the caller sent, so the header would start
        # with an address the caller chose. Nothing sits in front of this nginx,
        # so $remote_addr is the truth. (2026-08-09, security audit)
        proxy_set_header X-Forwarded-Proto $scheme;
        # Nothing behind /api/ may take longer than this. Anything that can
        # take longer belongs in the queue (docs/background-jobs.md): an AI
        # run's own time budget (ai.maxRunMs) lives in the worker, not in an
        # HTTP request -- POST /api/ai/runs answers as soon as the job is
        # enqueued (docs/ai-architecture.md).
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }

    location /docs {
        proxy_pass http://exocortex_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health/ {
        proxy_pass http://exocortex_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    # Next.js application.
    location / {
        proxy_pass http://exocortex_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;  # not $proxy_add_x_forwarded_for:
        # that appends to whatever the caller sent, so the header would start
        # with an address the caller chose. Nothing sits in front of this nginx,
        # so $remote_addr is the truth. (2026-08-09, security audit)
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # HTTP/2, because HTTP/1.1 caps Firefox at six connections per host and the
    # application shell opens far more than six at once: the sidebar tree makes
    # Next.js prefetch a route per visible page, twenty-odd requests in the same
    # instant. Under that cap a WebSocket had to queue behind them.
    #
    # nginx 1.24 has no separate `http2 on;` directive -- that arrived in
    # 1.25.1 -- so it goes on the listen line, which Certbot also writes. Certbot
    # only rewrites this file when it re-runs the installer, and deploy.sh copies
    # the repository's version over the installed one anyway, so this is the
    # authority either way.
    #
    # WebSockets are unaffected and keep their own HTTP/1.1 connections: nginx
    # does not implement RFC 8441, so the browser opens a separate connection for
    # an upgrade. That is the point -- those connections are now free.
    listen 443 ssl http2; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/exocortex.app/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/exocortex.app/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}


server {
    if ($host = www.exocortex.app) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = exocortex.app) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    server_name exocortex.app www.exocortex.app;

    listen 80;
    return 404; # managed by Certbot




}

# Internal listener for automations that run in Docker on this host, currently
# the Windmill morning briefing. The public vhost asks for HTTP basic auth, and
# basic auth and a bearer token cannot share the Authorization header -- so a
# caller that authenticates with an API token needs a door that does not ask
# for basic auth. This one is bound to the Docker bridge address, so it is not
# reachable from the internet (ufw only opens 22, 80 and 443), and the API
# token stays the actual authentication. ufw must allow the Docker subnets to
# reach this port; see deploy/README.md.
server {
    listen 172.17.0.1:3213;
    server_name exocortex-internal;

    client_max_body_size 32m;

    location /api/ {
        proxy_pass http://exocortex_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;  # not $proxy_add_x_forwarded_for:
        # that appends to whatever the caller sent, so the header would start
        # with an address the caller chose. Nothing sits in front of this nginx,
        # so $remote_addr is the truth. (2026-08-09, security audit)
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }

    location /health/ {
        proxy_pass http://exocortex_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    # Nothing else is served here; the web UI stays on the public vhost.
    location / {
        return 404;
    }
}