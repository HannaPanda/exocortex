packages:
  - 'apps/*'
  - 'packages/*'
  - 'e2e'

allowBuilds:
  esbuild: true
  '@prisma/client': true
  '@prisma/engines': true
  prisma: true
  sharp: true
  '@tailwindcss/oxide': true
  unrs-resolver: true
  '@parcel/watcher': true
  bcrypt: true
  'better-sqlite3': true
  msgpackr-extract: false
  '@scarf/scarf': false

# One copy of a package the type system compares structurally. Two versions of
# either of these are not a duplicate install, they are a compile error: the
# types carry private fields, so the same class from two paths is two types.
#
#   fastify           @nestjs/platform-fastify pins an older 5.x than the API.
#   prosemirror-view  the other prosemirror-* packages peer it loosely
#                     (^1.9.10), which lets an old resolution survive in the
#                     lockfile while @tiptap/pm asks for the current one.
overrides:
  fastify: 5.12.4
  prosemirror-view: 1.42.3
