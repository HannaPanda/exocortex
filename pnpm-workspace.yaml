packages:
  - 'apps/*'
  - 'packages/*'
  - 'e2e'

allowBuilds:
  esbuild: true
  '@prisma/client': true
  '@prisma/engines': true
  prisma: true
  sharp: true
  '@tailwindcss/oxide': true
  unrs-resolver: true
  '@parcel/watcher': true
  bcrypt: true
  'better-sqlite3': true
  msgpackr-extract: false
  '@scarf/scarf': false
  # Pulled in by next-intl for its message extractor, which this repository
  # does not use (issue #98); the postinstall only checks for the native
  # binary, which the optional platform package already provides.
  '@swc/core': false

# A package pnpm installed before it had aged past the release-age wait, added
# here by pnpm itself rather than by hand. 6.7.0 was four hours old when it went
# in: it is the release that widened the peer range to `@nestjs/common: ^12`,
# which is what let the API leave NestJS 11 at all (issue #65). Safe to delete
# once the entry is older than the wait -- it changes nothing then.
minimumReleaseAgeExclude:
  - '@nestjs/throttler@6.7.0'

# One copy of a package the type system compares structurally. Two versions of
# either of these are not a duplicate install, they are a compile error: the
# types carry private fields, so the same class from two paths is two types.
#
#   fastify           @nestjs/platform-fastify pins an older 5.x than the API.
#   prosemirror-view  the other prosemirror-* packages peer it loosely
#                     (^1.9.10), which lets an old resolution survive in the
#                     lockfile while @tiptap/pm asks for the current one.
overrides:
  fastify: 5.12.4
  prosemirror-view: 1.42.3
