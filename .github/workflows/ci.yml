name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Values match .env.example; the workflow starts its own services below.
  NODE_ENV: test
  APP_URL: http://localhost:3210
  API_URL: http://127.0.0.1:3211
  PUBLIC_API_URL: http://localhost:3211
  PUBLIC_COLLABORATION_URL: ws://localhost:3212
  DATABASE_URL: postgresql://exocortex:exocortex@127.0.0.1:5433/exocortex?schema=public
  REDIS_URL: redis://127.0.0.1:6380
  BETTER_AUTH_SECRET: ci-secret-ci-secret-ci-secret-1234
  BETTER_AUTH_URL: http://localhost:3210
  COLLABORATION_TICKET_SECRET: ci-ticket-ci-ticket-ci-ticket-123
  S3_ENDPOINT: http://127.0.0.1:9110
  S3_REGION: us-east-1
  S3_BUCKET: exocortex
  S3_ACCESS_KEY_ID: exocortex
  S3_SECRET_ACCESS_KEY: exocortex-ci-secret
  S3_FORCE_PATH_STYLE: 'true'
  SMTP_HOST: 127.0.0.1
  SMTP_PORT: '1026'
  SMTP_FROM: Exocortex <no-reply@exocortex.app>
  LOG_LEVEL: silent
  AI_PROVIDER: mock

jobs:
  static:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Dependency boundaries and ESLint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

  test:
    name: Unit and integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: exocortex
          POSTGRES_PASSWORD: exocortex
          POSTGRES_DB: exocortex
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U exocortex -d exocortex"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:8-alpine
        ports: ['6380:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
      minio:
        image: bitnami/minio:latest
        env:
          MINIO_ROOT_USER: exocortex
          MINIO_ROOT_PASSWORD: exocortex-ci-secret
          MINIO_DEFAULT_BUCKETS: exocortex
        ports: ['9110:9000']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply migrations
        run: pnpm db:migrate

      - name: Seed development data
        run: pnpm db:seed
        env:
          SEED_JOHANNA_PASSWORD: ci-password-johanna
          SEED_STEFAN_PASSWORD: ci-password-stefan

      - name: Test
        run: pnpm test
